<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UI redesign compare</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --surface: #fff;
        --ink: #1a1f36;
        --ink-2: #5d6a82;
        --line: #e1e4ea;
        --accent: #1a73e8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #14161c;
          --surface: #1d2029;
          --ink: #eef0f5;
          --ink-2: #a9b0c0;
          --line: #2e3240;
          --accent: #6aa3ff;
        }
      }
      :root[data-theme="dark"] {
        --bg: #14161c;
        --surface: #1d2029;
        --ink: #eef0f5;
        --ink-2: #a9b0c0;
        --line: #2e3240;
        --accent: #6aa3ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      header {
        padding: 24px 16px 8px;
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      header p {
        margin: 0;
        color: var(--ink-2);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 12px 16px;
        max-width: 1200px;
        margin: 0 auto;
      }
      nav button {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        border-radius: 999px;
        padding: 4px 12px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      nav button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 16px 48px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      figure {
        margin: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        color: var(--ink-2);
        margin-bottom: 8px;
      }
      figcaption b {
        color: var(--ink);
      }
      .cmp {
        position: relative;
        width: 100%;
        aspect-ratio: 1440 / 900;
        overflow: hidden;
        border-radius: 6px;
        background: var(--bg);
      }
      .cmp img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .cmp .after {
        clip-path: inset(0 0 0 var(--x, 50%));
      }
      .cmp .bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--x, 50%);
        width: 2px;
        background: var(--accent);
        transform: translateX(-1px);
        pointer-events: none;
      }
      .cmp .lbl {
        position: absolute;
        top: 8px;
        padding: 2px 8px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 12px;
      }
      .cmp .lbl.b {
        left: 8px;
      }
      .cmp .lbl.a {
        right: 8px;
      }
      .cmp input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: ew-resize;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>UI redesign, before and after</h1>
      <p>Branch redesign/ui, 2026-10-30. Drag across an image to compare. Details in README.md.</p>
    </header>
    <nav id="filters" aria-label="Filter by surface"></nav>
    <main id="list"></main>
    <script>
      const SHOTS = [
        ["chat", "Chat", "new-chat", "New chat"],
        ["chat", "Chat", "chat", "Chat with content"],
        ["chat", "Chat", "first-time-chat", "First chat after the run"],
        ["drafts", "Drafts", "panel-drafts", "Drafts panel"],
        ["drafts", "Drafts", "draft-edit", "Editing a draft"],
        ["drafts", "Drafts", "schedule-modal", "Schedule"],
        ["panel", "Panel", "panel-overview", "Overview"],
        ["panel", "Panel", "panel-sources", "Sources"],
        ["panel", "Panel", "panel-ideas", "Ideas"],
        ["panel", "Panel", "panel-clips", "Clips"],
        ["onboarding", "First run", "welcome-recap", "Review: what I learned"],
        ["onboarding", "First run", "welcome-voice", "Review: your voice"],
        ["playbook", "Playbooks", "playbooks", "Catalogue"],
        ["playbook", "Playbooks", "playbook-goals", "Fiche: Brief"],
        ["playbook", "Playbooks", "playbook-voice", "Fiche: Voice profile"],
        ["playbook", "Playbooks", "playbook-competitors", "Fiche: Competitors"],
        ["topics", "Topic Feed", "topics", "Feed"],
        ["topics", "Topic Feed", "topics-settings", "Feed settings"],
        ["image-studio", "Image Studio", "image-studio", "New style"],
        ["overlays", "Overlays", "modal-add-source", "Attach a file"],
      ];
      const list = document.getElementById("list");
      const filters = document.getElementById("filters");
      const surfaces = [["all", "All"], ...[...new Map(SHOTS.map(([id, name]) => [id, name]))]];
      let current = "all";
      try {
        current = localStorage.getItem("ui-redesign-filter") || "all";
      } catch (e) {}

      for (const [id, label, shot, caption] of SHOTS) {
        const fig = document.createElement("figure");
        fig.dataset.surface = id;
        fig.innerHTML = `
      <figcaption><b>${label}</b><span>${caption}</span></figcaption>
      <div class="cmp">
        <img src="before/${shot}.jpg" alt="${caption}, before" loading="lazy">
        <img class="after" src="after/${shot}.jpg" alt="${caption}, after" loading="lazy">
        <span class="bar"></span><span class="lbl b">Before</span><span class="lbl a">After</span>
        <input type="range" min="0" max="100" value="50" aria-label="${caption}: drag to compare before and after">
      </div>`;
        const cmp = fig.querySelector(".cmp");
        fig.querySelector("input").addEventListener("input", (e) => cmp.style.setProperty("--x", e.target.value + "%"));
        list.append(fig);
      }

      function apply() {
        for (const b of filters.children) b.setAttribute("aria-pressed", String(b.dataset.id === current));
        for (const f of list.children) f.hidden = current !== "all" && f.dataset.surface !== current;
        try {
          localStorage.setItem("ui-redesign-filter", current);
        } catch (e) {}
      }
      for (const [id, name] of surfaces) {
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.id = id;
        b.textContent = name;
        b.addEventListener("click", () => {
          current = id;
          apply();
        });
        filters.append(b);
      }
      apply();
    </script>
  </body>
</html>
